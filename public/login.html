<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Dropship Ledger</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <script>
    try { const t = localStorage.getItem('dd_theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
  <style>
    body {
      display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; padding: 16px;
      background:
        radial-gradient(900px 420px at 50% -10%, color-mix(in srgb, var(--s-revenue) 20%, transparent), transparent 70%),
        radial-gradient(600px 300px at 90% 110%, color-mix(in srgb, var(--s-profit) 12%, transparent), transparent 70%),
        var(--page);
    }
    .box { width: min(400px, 100%); padding: 30px 28px 26px; box-shadow: var(--shadow-lg); animation: pageIn 0.45s var(--ease) both; }
    .box .brand { padding: 0 0 18px; }
    .box .brand-mark { width: 40px; height: 40px; border-radius: 12px; font-size: 16px; }
    .box h1 { margin: 0; font-size: 20px; letter-spacing: -0.025em; }
    .box p { margin: 6px 0 20px; color: var(--ink-3); font-size: 13px; }
    .box label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
    .box .input { width: 100%; height: 44px; font-size: 15px; }
    .box .btn { width: 100%; height: 44px; margin-top: 12px; font-size: 14px; }
    .err { color: var(--bad-ink); font-size: 13px; min-height: 20px; margin-top: 12px; text-align: center; }
    .foot { text-align: center; font-size: 11.5px; color: var(--ink-4); margin-top: 14px; }
  </style>
</head>
<body>
  <form class="card box" id="f" autocomplete="on">
    <div class="brand"><div class="brand-mark">DL</div><div><div class="brand-name">Dropship Ledger</div><div class="brand-sub">eBay × Amazon profit</div></div></div>
    <h1>Welcome back</h1>
    <p>Sign in to see the numbers.</p>
    <label for="p">Password</label>
    <input class="input" type="password" id="p" placeholder="••••••••" autofocus autocomplete="current-password" />
    <button class="btn primary" type="submit">Sign in</button>
    <div class="err" id="e" aria-live="polite"></div>
    <div class="foot">Private dashboard · two partners, one ledger</div>
  </form>
  <script>
    const f = document.getElementById('f');
    const btn = f.querySelector('button');
    f.onsubmit = async (ev) => {
      ev.preventDefault();
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      try {
        const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('p').value }) });
        if (r.ok) { location.href = '/'; return; }
        document.getElementById('e').textContent = 'Wrong password';
      } catch { document.getElementById('e').textContent = 'Could not reach the server'; }
      btn.disabled = false;
      btn.textContent = 'Sign in';
    };
  </script>
</body>
</html>
