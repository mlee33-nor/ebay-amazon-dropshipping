<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sign in · Dropship Ledger</title>
  <meta name="theme-color" content="#09090b" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <script>
    try { const t = localStorage.getItem('dd_theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
  <style>
    body {
      min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 20px; position: relative; overflow: hidden;
      background: var(--page);
    }
    /* ambient: two soft glows + a faint dot grid that fades out toward the edges */
    .bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .bg .glow-a, .bg .glow-b { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.55; }
    .bg .glow-a { width: 720px; height: 520px; left: 50%; top: -260px; transform: translateX(-60%); background: radial-gradient(closest-side, color-mix(in srgb, var(--s-revenue) 55%, transparent), transparent); animation: drift 14s ease-in-out infinite alternate; }
    .bg .glow-b { width: 560px; height: 460px; right: -160px; bottom: -220px; background: radial-gradient(closest-side, color-mix(in srgb, var(--s-profit) 45%, transparent), transparent); animation: drift 18s ease-in-out infinite alternate-reverse; }
    .bg .dots {
      position: absolute; inset: 0;
      background-image: radial-gradient(color-mix(in srgb, var(--ink) 16%, transparent) 1px, transparent 1px);
      background-size: 22px 22px;
      -webkit-mask-image: radial-gradient(ellipse 60% 55% at 50% 45%, #000 20%, transparent 75%);
      mask-image: radial-gradient(ellipse 60% 55% at 50% 45%, #000 20%, transparent 75%);
      opacity: 0.55;
    }
    :root[data-theme='light'] .bg .glow-a, :root[data-theme='light'] .bg .glow-b { opacity: 0.35; }
    @keyframes drift { to { transform: translate(-40%, 30px) scale(1.06); } }

    .wrap { position: relative; z-index: 1; width: min(400px, 100%); animation: rise 0.6s var(--ease-out) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px) scale(0.985); } }
    .card.box { padding: 30px 28px 24px; box-shadow: var(--el-3); border-color: var(--line-strong); overflow: hidden; }
    .card.box::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 1px; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--ink) 25%, transparent), transparent); pointer-events: none; }
    .brand { padding: 0 0 22px; }
    .brand-mark { width: 40px; height: 40px; border-radius: 12px; }
    .brand-mark svg { width: 22px; height: 22px; }
    h1 { margin: 0; font-size: 22px; letter-spacing: -0.03em; font-weight: 600; line-height: 1.2; }
    .lede { margin: 6px 0 22px; color: var(--ink-3); font-size: 13.5px; }
    label { display: block; font-size: 12.5px; font-weight: 550; color: var(--ink-2); margin-bottom: 7px; }
    .pw { position: relative; }
    .pw .input { width: 100%; height: 44px; font-size: 15px; padding-right: 44px; letter-spacing: 0.02em; }
    .pw .input:not(:placeholder-shown) { font-family: var(--mono); letter-spacing: 0.14em; }
    .pw .input[type='text']:not(:placeholder-shown) { letter-spacing: 0.02em; }
    .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-3); cursor: pointer; display: grid; place-items: center; transition: background 0.15s, color 0.15s; }
    .eye:hover { background: var(--hover); color: var(--ink); }
    .eye svg { width: 16px; height: 16px; }
    .btn.primary { width: 100%; height: 44px; margin-top: 14px; font-size: 14px; border-radius: 10px; position: relative; }
    .btn.primary .spinner { width: 15px; height: 15px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.35); border-top-color: #fff; animation: rotate 0.8s linear infinite; display: none; }
    .btn.primary.busy .spinner { display: inline-block; }
    .btn.primary.busy .lbl { opacity: 0.85; }
    .err { display: flex; align-items: center; justify-content: center; gap: 7px; color: var(--bad-ink); font-size: 13px; min-height: 22px; margin-top: 12px; text-align: center; }
    .err svg { width: 14px; height: 14px; flex: none; }
    .err:empty { display: none; }
    .shake { animation: shake 0.4s var(--ease); }
    @keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
    .foot { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 11.5px; color: var(--ink-4); margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
    .foot svg { width: 12px; height: 12px; }
    .theme { position: fixed; top: 16px; right: 16px; z-index: 2; }
    .theme svg { width: 15px; height: 15px; }
    @media (max-width: 420px) { .card.box { padding: 26px 20px 20px; } }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><div class="glow-a"></div><div class="glow-b"></div><div class="dots"></div></div>
  <button class="btn icon-btn ghost theme" id="theme" type="button" title="Toggle theme" aria-label="Toggle theme"></button>

  <div class="wrap">
    <form class="card box" id="f" autocomplete="on" novalidate>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-5 4 3 7-8"/><path d="M15 7h5v5"/></svg></div>
        <div><div class="brand-name">Dropship Ledger</div><div class="brand-sub">eBay × Amazon profit</div></div>
      </div>
      <h1>Welcome back</h1>
      <p class="lede">Sign in to see the numbers.</p>
      <label for="p">Password</label>
      <div class="pw">
        <input class="input" type="password" id="p" placeholder="Enter the shared password" autofocus autocomplete="current-password" required />
        <button class="eye" type="button" id="eye" aria-label="Show password" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <button class="btn primary" type="submit" id="go"><span class="spinner" aria-hidden="true"></span><span class="lbl">Sign in</span></button>
      <div class="err" id="e" aria-live="polite" role="alert"></div>
      <div class="foot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Private dashboard · two partners, one ledger</div>
    </form>
  </div>

  <script>
    const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
    const ALERT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>';
    const themeBtn = document.getElementById('theme');
    const paint = () => { themeBtn.innerHTML = (document.documentElement.dataset.theme || 'dark') === 'dark' ? SUN : MOON; };
    themeBtn.onclick = () => {
      const next = (document.documentElement.dataset.theme || 'dark') === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem('dd_theme', next); } catch {}
      paint();
    };
    paint();

    const p = document.getElementById('p');
    const eye = document.getElementById('eye');
    eye.onclick = () => {
      const show = p.type === 'password';
      p.type = show ? 'text' : 'password';
      eye.setAttribute('aria-pressed', String(show));
      eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      p.focus();
    };

    const f = document.getElementById('f');
    const btn = document.getElementById('go');
    const err = document.getElementById('e');
    const fail = (msg) => {
      err.innerHTML = `${ALERT}<span>${msg}</span>`;
      f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
      p.select();
    };
    p.addEventListener('input', () => { err.textContent = ''; });
    f.onsubmit = async (ev) => {
      ev.preventDefault();
      if (!p.value) return fail('Enter the password');
      btn.disabled = true;
      btn.classList.add('busy');
      btn.querySelector('.lbl').textContent = 'Signing in…';
      try {
        const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: p.value }) });
        if (r.ok) { btn.querySelector('.lbl').textContent = 'Welcome back'; location.href = '/'; return; }
        fail('Wrong password');
      } catch { fail('Could not reach the server'); }
      btn.disabled = false;
      btn.classList.remove('busy');
      btn.querySelector('.lbl').textContent = 'Sign in';
    };
  </script>
</body>
</html>
