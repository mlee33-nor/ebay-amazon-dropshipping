<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Dropship Ledger</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <style>
    body { display: grid; place-items: center; min-height: 100vh; padding: 16px;
      background: radial-gradient(800px 400px at 50% -10%, rgba(57,135,229,.18), transparent 70%), var(--page); }
    .box { width: min(380px, 100%); padding: 28px; }
    .box .input { width: 100%; height: 42px; margin: 18px 0 12px; }
    .box .btn { width: 100%; height: 42px; }
    .err { color: var(--bad-ink); font-size: 13px; min-height: 20px; margin-top: 10px; }
  </style>
</head>
<body>
  <form class="card box" id="f">
    <div class="brand" style="padding:0 0 6px"><div class="brand-mark">DL</div><div><div class="brand-name">Dropship Ledger</div><div class="brand-sub">Sign in to continue</div></div></div>
    <input class="input" type="password" id="p" placeholder="Password" autofocus autocomplete="current-password" />
    <button class="btn primary" type="submit">Sign in</button>
    <div class="err" id="e"></div>
  </form>
  <script>
    document.getElementById('f').onsubmit = async (ev) => {
      ev.preventDefault();
      const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('p').value }) });
      if (r.ok) location.href = '/'; else document.getElementById('e').textContent = 'Wrong password';
    };
  </script>
</body>
</html>
