<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Finish eBay connection · Dropship Ledger</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <style>
    body { display: grid; place-items: center; min-height: 100vh; padding: 16px; background: var(--page); }
    .box { width: min(560px, 100%); padding: 28px; }
    h1 { margin: 0 0 6px; font-size: 20px; }
    ol { color: var(--ink-2); font-size: 13.5px; padding-left: 18px; line-height: 1.6; }
    textarea { width: 100%; min-height: 110px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--ink); font: 12px var(--mono, monospace); }
    .row2 { display: flex; gap: 10px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
    .msg { font-size: 13.5px; margin-top: 12px; min-height: 20px; }
  </style>
</head>
<body>
  <div class="card box">
    <h1>Finish connecting eBay</h1>
    <ol>
      <li><a href="/api/ebay/connect" target="_blank" rel="noopener"><b>Click here to open eBay</b></a>, sign in to the seller account and click <b>Agree</b>.</li>
      <li>eBay shows <i>"Authorization successfully completed"</i>. Copy the <b>full address</b> from that tab's address bar.</li>
      <li>Paste it below and click <b>Connect</b> within 5 minutes.</li>
    </ol>
    <textarea id="u" placeholder="https://auth2.ebay.com/oauth2/ThirdPartyAuthSucessFailure?isAuthSuccessful=true&code=..."></textarea>
    <div class="row2"><button class="btn primary" id="go">Connect</button><a class="btn" href="/#/settings">Back to dashboard</a></div>
    <div class="msg" id="m"></div>
  </div>
  <script>
    document.getElementById('go').onclick = async () => {
      const m = document.getElementById('m');
      m.textContent = 'Connecting…';
      m.className = 'msg';
      const r = await fetch('/api/ebay/code', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: document.getElementById('u').value }) });
      if (r.status === 401) { location.href = '/login'; return; }
      const b = await r.json().catch(() => ({}));
      if (r.ok) { m.textContent = 'eBay connected. Pulling your sales now…'; m.className = 'msg pos'; setTimeout(() => (location.href = '/#/settings?ebay=connected'), 1500); }
      else { m.textContent = (b.error || 'Failed') + ' — if it says the code expired, repeat step 1.'; m.className = 'msg neg'; }
    };
  </script>
</body>
</html>
